name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Lint
        run: flake8 src tests --max-line-length 100
      - name: Unit tests
        run: pytest -q
      - name: Start MLflow server
        run: |
          nohup mlflow server --host 127.0.0.1 --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --artifacts-destination ./mlartifacts > mlflow.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/health && break; sleep 2; done
      - name: Run DVC pipeline (with quality gate)
        run: dvc repro --force
      - name: Metrics summary
        if: always()
        run: dvc metrics show --md >> $GITHUB_STEP_SUMMARY || true
      - name: Upload MLflow results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-results-ci
          path: |
            mlflow.db
            mlartifacts
