stages:
  prepare:
    cmd: python src/prepare_data.py
    deps:
      - src/prepare_data.py
      - src/common.py
    params:
      - data
    outs:
      - data/processed
  train_ml:
    cmd: python src/train_ml.py
    deps:
      - src/train_ml.py
      - src/common.py
      - data/processed
    params:
      - data.seed
      - ml
    outs:
      - models/ml_model.joblib
    metrics:
      - metrics/ml.json:
          cache: false
  train_dl:
    cmd: python src/train_dl.py
    deps:
      - src/train_dl.py
      - src/common.py
      - data/processed
    params:
      - data.seed
      - dl
    outs:
      - models/dl_model.pt
    metrics:
      - metrics/dl.json:
          cache: false
  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - metrics/ml.json
      - metrics/dl.json
    params:
      - gate
    metrics:
      - metrics/summary.json:
          cache: false
